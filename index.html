<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <title>Onion's True Listener</title>
  <style>
    @font-face {
      font-family: 'Pixelify';
      src: url('fonts/PixelifySans.ttf');
      font-weight: 400 700;
      font-display: block;
    }

    :root {
      --bg: #120e24;
      --win: #1c1640;
      --win-edge: #3b2f73;
      --win-hi: #5a4a9e;
      --bar: #2a2055;
      --dot: #c44dff;
      --bezel: #2d2358;
      --bezel-edge: #5847a0;
      --screen: #0b0a1e;
      --screen-edge: #1a1640;
      --ink: #e6e1ff;
      --cyan: #86e8ff;
      --vio: #9d8bd6;
      --vio-dim: #6f63a0;
      --accent: #7c5cff;
      --accent-hi: #9b82ff;
      --hot: #ff5c8a;
      --label: #6f63a0;
      --box: #221a44;
      --box-edge: #43367e;
      color-scheme: dark;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }
    body {
      font-family: 'Pixelify', 'Cascadia Mono', Consolas, monospace;
      background: var(--bg);
      color: var(--ink);
      overflow: hidden;
      user-select: none;
      -webkit-font-smoothing: none;
    }

    /* ===== Window ===== */
    .px-win {
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: var(--win);
      border: 3px solid var(--win-edge);
      box-shadow: inset 0 0 0 1px var(--win-hi);
    }

    /* ===== Title bar ===== */
    .px-title {
      -webkit-app-region: drag;
      display: flex;
      align-items: center;
      gap: 8px;
      height: 30px;
      padding: 0 8px;
      background: linear-gradient(180deg, #3a2d6b, #2a2055);
      border-bottom: 2px solid var(--win-edge);
    }
    .px-tvdot {
      width: 12px; height: 12px;
      background: var(--dot);
      box-shadow: 0 0 0 2px #2a2055, 0 0 8px var(--dot);
    }
    .px-titletext {
      font-size: 12px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--ink);
      flex: 1;
    }
    .px-wbtns { -webkit-app-region: no-drag; display: flex; gap: 4px; }
    .px-wbtn {
      width: 22px; height: 20px;
      background: var(--box);
      border: 2px solid var(--box-edge);
      color: var(--vio);
      font-family: inherit;
      font-size: 11px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      line-height: 1;
    }
    .px-wbtn:hover { background: #2e2356; color: var(--ink); }
    .px-wbtn.px-x:hover { background: var(--hot); color: #fff; border-color: var(--hot); }

    /* ===== Body ===== */
    .px-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 12px;
    }

    /* ===== Bezel + screen ===== */
    .px-bezel {
      flex: 1;
      background: var(--bezel);
      border: 3px solid var(--bezel-edge);
      box-shadow: inset 0 0 0 2px #1f1840;
      padding: 8px;
    }
    .px-screen {
      position: relative;
      height: 100%;
      background:
        radial-gradient(120% 120% at 50% 40%, #14122e 0%, var(--screen) 70%);
      border: 2px solid var(--screen-edge);
      overflow: hidden;
    }
    .px-screen::after {
      content: '';
      position: absolute; inset: 0;
      pointer-events: none;
      background: repeating-linear-gradient(
        0deg, rgba(0,0,0,0.28) 0px, rgba(0,0,0,0.28) 1px, transparent 1px, transparent 3px);
    }
    .px-screen.live { box-shadow: inset 0 0 22px rgba(124,92,255,0.35); }

    .px-screen-inner {
      position: absolute; inset: 0;
      padding: 22px 24px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 10px;
      z-index: 1;
    }
    .scr-big {
      font-size: 30px;
      letter-spacing: 6px;
      color: var(--cyan);
      text-shadow: 0 0 8px rgba(134,232,255,0.5);
    }
    .scr-big.live { color: var(--hot); text-shadow: 0 0 10px rgba(255,92,138,0.6); }
    .scr-big.err { color: var(--hot); }
    .scr-hint {
      font-size: 13px;
      letter-spacing: 1px;
      color: var(--vio);
      line-height: 1.5;
    }
    .scr-hint b { color: var(--accent-hi); }
    .scr-text {
      font-size: 16px;
      letter-spacing: 0.5px;
      line-height: 1.5;
      color: var(--ink);
      max-height: 100%;
      overflow-y: auto;
      user-select: text;
      white-space: pre-wrap;
    }
    .px-gpu {
      position: absolute;
      bottom: 8px; left: 10px;
      z-index: 2;
      font-size: 10px; letter-spacing: 1px;
      color: var(--vio-dim);
    }
    .px-gpu b { color: var(--cyan); font-weight: 400; }
    .px-scrbtns {
      position: absolute;
      bottom: 6px; right: 6px;
      z-index: 2;
      display: none;
      gap: 5px;
    }
    .px-scrbtns.show { display: flex; }
    .px-scrbtn {
      -webkit-app-region: no-drag;
      background: var(--box);
      border: 2px solid var(--box-edge);
      color: var(--vio);
      font-family: inherit; font-size: 10px; letter-spacing: 2px;
      padding: 5px 9px;
      cursor: pointer;
    }
    .px-scrbtn:hover { background: var(--accent); color: #fff; border-color: var(--accent); }
    #clear-btn:hover { background: var(--hot); border-color: var(--hot); }

    /* ===== Meter ===== */
    .px-meter {
      display: flex;
      gap: 4px;
      height: 26px;
      padding: 5px;
      background: #15102e;
      border: 2px solid var(--box-edge);
    }
    .px-seg {
      flex: 1;
      background: #251e47;
      box-shadow: inset 0 0 0 1px #1a1438;
    }
    .px-seg.on { background: var(--accent); box-shadow: 0 0 6px var(--accent); }
    .px-seg.on.hot { background: var(--hot); box-shadow: 0 0 6px var(--hot); }

    /* ===== Toolbar ===== */
    .px-toolbar {
      display: flex;
      gap: 8px;
      height: 60px;
    }
    /* всі елементи панелі — однакова висота */
    .px-drop, .px-hot, .px-start {
      height: 60px;
      border: 2px solid var(--box-edge);
      font-family: inherit;
      cursor: pointer;
      -webkit-app-region: no-drag;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 3px;
      padding: 0 12px;
    }
    .px-drop, .px-hot { background: var(--box); position: relative; }
    .px-drop:hover, .px-hot:hover { background: #2a2056; }
    .px-droplabel {
      font-size: 9px; letter-spacing: 2px; color: var(--label); text-transform: uppercase;
    }
    .px-dropval {
      font-size: 14px; letter-spacing: 1px; color: var(--ink); text-transform: uppercase;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .px-drop { min-width: 84px; }
    .px-hot { flex: 1; }
    .px-hot.is-capturing { border-color: var(--accent-hi); background: #322663; }

    .px-start {
      flex: 1.2;
      align-items: center;
      flex-direction: row;
      justify-content: center;
      background: var(--accent);
      border-color: var(--accent-hi);
      color: #fff;
      font-size: 16px; letter-spacing: 3px;
      text-shadow: 0 0 6px rgba(0,0,0,0.4);
    }
    .px-start:hover { background: var(--accent-hi); }
    .px-start.is-on { background: var(--hot); border-color: #ff86a8; }

    /* ===== Dropdown popup ===== */
    .px-popup {
      display: none;
      position: absolute;
      left: -2px; right: -2px;
      bottom: calc(100% + 4px);
      background: var(--box);
      border: 2px solid var(--box-edge);
      z-index: 10;
      max-height: 220px;
      overflow-y: auto;
    }
    .px-drop.open .px-popup { display: block; }
    /* mic popup is wider than its button so full device names are readable */
    #mic-popup { right: auto; width: 300px; }
    .px-opt {
      padding: 9px 12px;
      font-size: 13px; letter-spacing: 1px;
      color: var(--vio);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .px-opt:hover { background: var(--accent); color: #fff; }
    .px-opt.sel { color: var(--ink); background: #2e2356; }

    /* ===== first-run model choice (on screen) ===== */
    .scr-choices { display: flex; gap: 10px; margin-top: 6px; }
    .scr-choice {
      flex: 1; text-align: left; background: var(--box); border: 2px solid var(--box-edge);
      color: var(--ink); font-family: inherit; font-size: 13px; padding: 10px 12px; cursor: pointer;
    }
    .scr-choice:hover { background: var(--accent); border-color: var(--accent-hi); }
    .scr-choice b { color: var(--cyan); }
    .scr-choice span { color: var(--vio); font-size: 11px; }
    .scr-choice:hover b, .scr-choice:hover span { color: #fff; }

    /* ===== Options / Models overlay ===== */
    .px-overlay {
      display: none;
      position: absolute; inset: 0; z-index: 50;
      background: rgba(8, 6, 20, 0.82);
      padding: 18px;
    }
    .px-overlay.show { display: flex; }
    .px-panel {
      margin: auto; width: 100%; max-width: 560px;
      background: var(--win); border: 3px solid var(--win-edge);
      box-shadow: inset 0 0 0 1px var(--win-hi);
      display: flex; flex-direction: column; max-height: 100%;
    }
    .px-panel-head {
      display: flex; align-items: center; justify-content: space-between;
      padding: 8px 10px; background: linear-gradient(180deg, #3a2d6b, #2a2055);
      border-bottom: 2px solid var(--win-edge);
    }
    .px-panel-title { font-size: 13px; letter-spacing: 2px; text-transform: uppercase; }
    .px-mlist { padding: 10px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
    .px-panel-foot { padding: 8px 12px; font-size: 11px; color: var(--label); border-top: 2px solid var(--win-edge); }

    .px-mrow {
      display: flex; align-items: center; gap: 10px;
      background: var(--box); border: 2px solid var(--box-edge); padding: 10px 12px; cursor: pointer;
    }
    .px-mrow:hover { background: #2a2056; }
    .px-mrow.active { border-color: var(--accent-hi); }
    .px-mradio {
      width: 14px; height: 14px; flex: none;
      border: 2px solid var(--box-edge); background: #15102e;
    }
    .px-mrow.active .px-mradio { background: var(--accent); box-shadow: 0 0 6px var(--accent); }
    .px-minfo { flex: 1; min-width: 0; }
    .px-mname { font-size: 14px; color: var(--ink); }
    .px-mtag { font-size: 11px; color: var(--label); margin-left: 6px; }
    .px-mnote { font-size: 11px; color: var(--vio); }
    .px-mstatus { font-size: 11px; letter-spacing: 1px; color: var(--label); white-space: nowrap; }
    .px-mstatus.ok { color: #3ecf8e; }
    .px-mtrash {
      flex: none; background: var(--box); border: 2px solid var(--box-edge);
      color: var(--vio); font-family: inherit; font-size: 12px; padding: 5px 8px; cursor: pointer;
    }
    .px-mtrash:hover { background: var(--hot); border-color: var(--hot); color: #fff; }
    .px-mconfirm { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--ink); }
    .px-mconfirm button {
      font-family: inherit; font-size: 11px; padding: 4px 8px; border: 2px solid var(--box-edge);
      background: var(--box); color: var(--vio); cursor: pointer;
    }
    .px-mconfirm .yes:hover { background: var(--hot); border-color: var(--hot); color: #fff; }
    .px-mconfirm .no:hover { background: var(--accent); color: #fff; }
  </style>
</head>
<body>
  <div class="px-win">
    <div class="px-title" id="titlebar">
      <span class="px-tvdot"></span>
      <span class="px-titletext">Onion's True Listener</span>
      <span class="px-wbtns">
        <button class="px-wbtn" id="opts-btn" title="Options">⚙</button>
        <button class="px-wbtn" id="min-btn" title="Minimize">_</button>
        <button class="px-wbtn px-x" id="close-btn" title="Close">✕</button>
      </span>
    </div>

    <div class="px-body">
      <div class="px-bezel">
        <div class="px-screen" id="screen">
          <div class="px-screen-inner" id="screen-inner"></div>
          <div class="px-gpu" id="gpu-label"></div>
          <div class="px-scrbtns" id="scrbtns">
            <button class="px-scrbtn" id="copy-btn" title="Copy all text">COPY</button>
            <button class="px-scrbtn" id="clear-btn" title="Clear screen">CLEAR</button>
          </div>
        </div>
      </div>

      <div class="px-meter" id="meter"></div>

      <div class="px-toolbar">
        <div class="px-drop" id="lang-drop" tabindex="0">
          <span class="px-droplabel">Lang</span>
          <span class="px-dropval" id="lang-val">UKR ▾</span>
          <div class="px-popup" id="lang-popup"></div>
        </div>
        <div class="px-drop" id="mic-drop" tabindex="0">
          <span class="px-droplabel">Mic</span>
          <span class="px-dropval" id="mic-val">DEFAULT ▾</span>
          <div class="px-popup" id="mic-popup"></div>
        </div>
        <button class="px-hot" id="hotkey-btn">
          <span class="px-droplabel">Hotkey</span>
          <span class="px-dropval" id="hotkey-val">F9</span>
        </button>
        <button class="px-start" id="toggle">▶ START</button>
      </div>
    </div>

    <div class="px-overlay" id="overlay">
      <div class="px-panel">
        <div class="px-panel-head">
          <span class="px-panel-title">⚙ Models</span>
          <button class="px-wbtn px-x" id="opts-close" title="Close">✕</button>
        </div>
        <div class="px-mlist" id="model-list"></div>
        <div class="px-panel-foot">Pick a model to use it. Not downloaded yet → it'll download first.</div>
      </div>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
