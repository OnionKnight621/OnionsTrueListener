<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <title>OnionsTrueListener</title>
  <style>
    :root { color-scheme: dark; }
    body {
      font-family: system-ui, sans-serif;
      background: #1a1a1e;
      color: #e8e8ea;
      margin: 0;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      height: calc(100vh - 48px);
    }
    .header { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
    h1 { font-size: 18px; margin: 0; font-weight: 600; }
    .sub { color: #9a9aa2; font-size: 13px; margin-top: -8px; }
    label { font-size: 13px; color: #9a9aa2; display: block; margin-bottom: 6px; }

    button {
      font-size: 15px; padding: 12px 16px; border: none; border-radius: 10px;
      background: #4f6bed; color: white; cursor: pointer; font-weight: 600;
    }
    button:hover { background: #5d77f0; }
    button:disabled { background: #3a3a42; color: #777; cursor: default; }
    #toggle { font-size: 16px; padding: 14px 18px; }
    #toggle.recording { background: #e0475a; }

    /* кнопка закриття */
    #close-btn {
      background: #2a2a30; color: #c9c9d0; font-size: 16px; line-height: 1;
      padding: 8px 12px; border-radius: 8px;
    }
    #close-btn:hover { background: #e0475a; color: white; }

    /* перемикач мови */
    .seg { display: flex; gap: 6px; }
    .seg button {
      flex: 1; background: #2a2a30; color: #c9c9d0; font-size: 14px; padding: 10px;
    }
    .seg button.active { background: #4f6bed; color: white; }
    .seg button:hover { background: #3a3a45; }
    .seg button.active:hover { background: #5d77f0; }

    /* вибір мікрофона */
    .mic-row { display: flex; gap: 8px; align-items: center; }
    .mic-name {
      flex: 1; font-size: 13px; color: #c9c9d0; background: #2a2a30;
      border: 1px solid #3a3a42; border-radius: 8px; padding: 9px 10px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .mic-row button { background: #2a2a30; color: #c9c9d0; padding: 9px 12px; font-size: 14px; }
    .mic-row button:hover { background: #3a3a45; }

    .meter-wrap {
      height: 22px; background: #2a2a30; border-radius: 8px;
      overflow: hidden; border: 1px solid #3a3a42;
    }
    .meter {
      height: 100%; width: 0%;
      background: linear-gradient(90deg, #3ecf8e, #ffd166 70%, #e0475a);
      transition: width 0.05s linear;
    }
    #status { font-size: 13px; color: #9a9aa2; min-height: 18px; }
    .ok { color: #3ecf8e !important; }
    .warn { color: #ffd166 !important; }
    .err { color: #e0475a !important; }
    .output-label { display: flex; justify-content: space-between; align-items: center; }
    .out-right { display: flex; align-items: center; gap: 10px; }
    #lang-detected { font-size: 12px; color: #6f6f78; }
    #copy-btn { background: #2a2a30; color: #c9c9d0; font-size: 13px; padding: 7px 11px; }
    #copy-btn:hover { background: #3a3a45; }
    #output {
      flex: 1; background: #111114; border: 1px solid #3a3a42; border-radius: 10px;
      padding: 16px; font-size: 16px; line-height: 1.5; overflow-y: auto;
      white-space: pre-wrap; color: #f0f0f2;
      user-select: text; cursor: text;
    }
    #output.empty { color: #55555e; }
  </style>
</head>
<body>
  <h1>🎙️ OnionsTrueListener</h1>
  <p class="sub">Глобально: <b>тримай F9</b> у будь-якому застосунку → говори → відпусти → текст вставиться під курсор. Модель: large-v3, CUDA.</p>

  <div>
    <label>Мова диктовки</label>
    <div class="seg" id="lang-seg">
      <button data-lang="uk">Українська</button>
      <button data-lang="en">English</button>
      <button data-lang="auto">Авто</button>
    </div>
  </div>

  <div>
    <label>Мікрофон</label>
    <div class="mic-row">
      <span class="mic-name" id="mic-name">— мікрофон за замовчуванням —</span>
      <button id="mic-next" title="Наступний мікрофон">↻</button>
    </div>
  </div>

  <div class="meter-wrap"><div class="meter" id="meter"></div></div>

  <button id="toggle">⏺️ Старт запису</button>

  <div id="status">Готово. Тримай F9 або натисни «Старт».</div>

  <div class="output-label">
    <label>Розпізнаний текст</label>
    <div class="out-right">
      <span id="lang-detected"></span>
      <button id="copy-btn" title="Скопіювати весь текст">📋 Копіювати</button>
    </div>
  </div>
  <div id="output" class="empty">— тут зʼявиться розпізнаний текст —</div>

  <script src="renderer.js"></script>
</body>
</html>
